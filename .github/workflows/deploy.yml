name: Deploy server

on:
  push:
    branches: [main]
  workflow_dispatch: # tombol "Run workflow" manual di tab Actions

# Cegah dua deploy jalan bersamaan (git pull/tsc/pm2 restart saling tabrak)
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    # Runner dipasang di server Windows sebagai service dengan user Administrator,
    # supaya perintah pm2 melihat proses yang sama dengan yang sedang jalan.
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: cmd
        # Folder clone yang dijalankan PM2 (berisi .env + credential yang tidak ada di git)
        working-directory: C:\Users\Administrator\Documents\GitHub\pushnotifBasra
    steps:
      # Tidak pakai actions/checkout: aplikasi jalan langsung dari folder clone di server.
      # Pull dipisah dari deploy.cmd supaya script tidak berubah saat sedang dijalankan.
      - name: git pull
        run: git pull --ff-only

      - name: Build + restart PM2
        run: call scripts\deploy.cmd
